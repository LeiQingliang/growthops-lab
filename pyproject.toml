[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growthops-lab"
version = "0.1.0"
description = "Offline event analytics for AI product operations: funnels, exact-day retention and costs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LeiQingliang"}]
dependencies = []

[project.scripts]
growthops = "growthops.__main__:main"

[tool.setuptools.packages.find]
include = ["growthops*"]
